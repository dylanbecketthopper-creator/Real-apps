<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>yay project</title>
  <link rel="stylesheet" href="./style.css">

</head>
<body>
<!-- partial:index.partial.html -->
<div id="app">
  <!-- Navbar -->
  <nav class="navbar">
    <h1 class="logo" onclick="goHome()">Skill Snail 🐌 a</h1>
    <div class="nav-buttons">
      <button onclick="goHome()">Home</button>
      <button onclick="startLesson()">Lesson</button>
    </div>
  </nav>

  <!-- Home Page -->
  <div id="home" class="page">
    <div class="home-content">
      <h2>Learn Real-Life Skills</h2>
      <p>Forget boring school subjects you’ll never use. Skill Snail 🐌 helps you master the things that really matter — from finances to communication, with lessons guided by AI.</p>
      <button id="startBtn" onclick="startLesson()">Start Learning</button>
      <div class="stats">
        <p id="xp">XP: 0</p>
        <p id="streak">Streak: 0 🔥</p>
      </div>
    </div>
    <div class="snail">🐌</div>
  </div>

  <!-- Lesson Page -->
  <div id="lesson" class="page hidden">
    <div class="lesson-window">
      <div class="progress-bar">
        <div id="progress"></div>
      </div>
      <div id="stepContent"></div>
      <div class="lesson-buttons">
        <button id="backBtn" onclick="prevStep()">Back</button>
        <button id="nextBtn" onclick="nextStep()">Next</button>
      </div>
    </div>
  </div>
</div>
<!-- partial -->
  <script  src="./script.js"></script>

</body>
</html>
